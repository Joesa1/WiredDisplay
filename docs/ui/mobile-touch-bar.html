<main class="preview">

<section class="overlay" id="details-panel" aria-label="卡片详情" hidden><header class="overlay-header"><h2 id="details-title"></h2><button class="close" aria-label="关闭详情">×</button></header><div class="details" id="details-content"></div></section>
</section></div>
<footer class="footer"><span><svg><use href="#bolt"/></svg>可点按、切歌、调节滑杆；所有操作仅为模拟。</span><span>设计参考 <a href="https://github.com/pock/pock" target="_blank" rel="noreferrer">Pock</a> / macOS Touch Bar</span></footer>
</main>
<script>
const $ = id => document.getElementById(id);
const apps = [
 {name:'Finder',icon:'finder',style:'finder',running:true},
 {name:'Safari',icon:'safari',style:'safari',running:true},
 {name:'信息',icon:'messages',style:'messages',running:true,badge:2},
 {name:'音乐',icon:'music',style:'music-icon',running:true},
 {name:'终端',icon:'terminal',style:'terminal',running:true},
 {name:'VS Code',icon:'code',style:'vscode',running:true},
 {name:'Claude',icon:'claude',style:'claude'},
 {name:'备忘录',icon:'notes',style:'notes'}
];
let activeApp='音乐',playing=true,trackIndex=0,toastTimer,returnFocus;
const tracks=[['日落之后','缓慢电台 · 夜间漫游',244],['沿海公路','缓慢电台 · 周末出走',217],['凌晨四点','缓慢电台 · 城市微光',268]];
function appButton(app,label=false){const b=document.createElement('button');b.className='app'+(app.running?' running':'')+(activeApp===app.name?' selected':'');b.setAttribute('aria-label','打开 '+app.name);b.setAttribute('aria-pressed',String(activeApp===app.name));b.innerHTML=`<span class="app-icon ${app.style}"><svg aria-hidden="true"><use href="#${app.icon}"/></svg></span>${app.badge?`<span class="badge">${app.badge}</span>`:''}${label?`<small>${app.name}</small>`:''}`;b.onclick=()=>{activeApp=app.name;renderApps();closePanels();notify('模拟切换至 '+app.name)};return b}
function renderApps(){ $('dock-apps').replaceChildren(...apps.map(a=>appButton(a))); const filtered=apps.filter(a=>a.name.toLowerCase().includes($('app-search').value.toLowerCase()));$('app-grid').replaceChildren(...filtered.map(a=>appButton(a,true)));$('empty-search').hidden=filtered.length>0; }
function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,1800)}
function openPanel(id){returnFocus=document.activeElement;document.querySelectorAll('.overlay').forEach(p=>p.hidden=true);$(id).hidden=false;$(id).querySelector('input,button').focus()}
function closePanels(){document.querySelectorAll('.overlay').forEach(p=>p.hidden=true);if(returnFocus?.isConnected)returnFocus.focus();returnFocus=null}
function launcher(){openPanel('launcher-panel');$('app-search').value='';renderApps();$('app-search').focus()}
function details(title,content){$('details-title').textContent=title;$('details-content').innerHTML=content;openPanel('details-panel')}
function setPlaying(value){playing=value;$('toggle-play').setAttribute('aria-label',playing?'暂停':'播放');$('toggle-play').setAttribute('aria-pressed',String(playing));$('toggle-play').querySelector('use').setAttribute('href',playing?'#pause':'#play');document.querySelector('.music').classList.toggle('paused',!playing)}
function formatTime(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function updateProgress(){$('elapsed').textContent=formatTime(+$('seek').value);$('remaining').textContent='−'+formatTime(+$('seek').max-+$('seek').value)}
function changeTrack(offset){trackIndex=(trackIndex+offset+tracks.length)%tracks.length;const [title,artist,duration]=tracks[trackIndex];$('track-title').textContent=title;$('artist').textContent=artist;$('seek').max=duration;$('seek').value=0;updateProgress();setPlaying(true)}
$('toggle-play').onclick=()=>setPlaying(!playing);$('next-track').onclick=()=>changeTrack(1);$('previous-track').onclick=()=>changeTrack(-1);$('seek').oninput=updateProgress;
$('open-launcher').onclick=launcher;$('open-search').onclick=launcher;$('app-search').oninput=renderApps;
$('escape').onclick=()=>{closePanels();notify('模拟发送 Esc')};document.querySelectorAll('.close').forEach(b=>b.onclick=closePanels);document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>notify(b.dataset.demo));
$('focus').onclick=()=>{const enabled=$('focus').getAttribute('aria-pressed')!=='true';$('focus').setAttribute('aria-pressed',String(enabled));$('focus').classList.toggle('active',enabled);notify(enabled?'模拟开启专注模式':'模拟关闭专注模式')};
let lastVolume=42;
function updateVolume(){const value=+$('volume').value;$('volume').nextElementSibling.value=value;$('mute-button').setAttribute('aria-pressed',String(value===0));$('mute-button').classList.toggle('active',value===0)}
$('volume').oninput=()=>{if(+$('volume').value>0)lastVolume=+$('volume').value;updateVolume()};$('brightness').oninput=()=>{$('brightness').nextElementSibling.value=$('brightness').value};
$('mute-button').onclick=()=>{if(+$('volume').value>0){lastVolume=+$('volume').value;$('volume').value=0}else $('volume').value=lastVolume;updateVolume()};
$('agent-details').onclick=()=>details('Agent 状态','<strong>Claude Code</strong><br>Thunder Display · 正在编写界面<br><br><strong>Codex</strong><br>网页原型 · 等待你确认布局<br><br>这是状态展示样例，尚未连接本机 Agent。');
$('weather-details').onclick=()=>details('上海 · 天气','<strong>24°　晴间多云</strong><br>最高 26° · 最低 19°<br><br>天气为设计样例，尚未接入实时数据。');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels();const panel=[...document.querySelectorAll('.overlay')].find(p=>!p.hidden);if(panel&&e.key==='Tab'){const items=[...panel.querySelectorAll('button,input')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
setInterval(()=>{if(playing&&!document.hidden){if(+$('seek').value>=+$('seek').max)changeTrack(1);else{$('seek').value=+$('seek').value+1;updateProgress()}}},1000);
function clock(){$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}clock();setInterval(clock,30000);renderApps();
</script>
</body>
</html>
