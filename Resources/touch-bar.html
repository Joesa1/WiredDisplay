</div>
<nav class="dock" id="apps-card" aria-label="应用坞"><div class="apps" id="dock-apps"></div><button class="launcher" id="open-launcher" aria-label="全部应用" title="应用坞显示前 12 个应用，运行中的优先；在此查看全部应用"><svg><use href="#grid"/></svg></button></nav>
<div class="control-strip" id="controls-card"><button class="key" data-action="key.escape" aria-label="发送 Escape">esc</button><button class="key" data-action="key.desktop" aria-label="显示桌面"><svg><use href="#mac"/></svg></button><button class="key" data-action="key.search" aria-label="打开 Spotlight"><svg><use href="#search"/></svg></button><label class="slider-key" title="屏幕亮度"><svg><use href="#sun"/></svg><input id="brightness" type="range" min="0" max="100" aria-label="屏幕亮度" disabled><output id="brightness-value">—</output></label><button class="key" id="mute-button" data-action="volume.mute" aria-label="静音" disabled><svg><use href="#volume-icon"/></svg></button><label class="slider-key" title="音量"><input id="volume" type="range" min="0" max="100" aria-label="音量" disabled><output id="volume-value">—</output></label></div>
<div id="controls-message" class="message"></div><p class="empty" id="all-off" hidden>尚未启用组件，请在 Mac 的 Touch Bar 设置中开启。</p>
</main>
<section class="pair" id="pair"><form id="pair-form"><h1>Touch Bar</h1><p>在 Mac 的 Thunder Display → Touch Bar 中查看配对码。手机与 Mac 需连接到同一局域网。</p><label for="pair-code">配对码</label><input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required><button type="submit" id="pair-submit">连接 Mac</button><p id="pair-message" role="status"></p></form></section>
<section class="overlay" id="launcher-panel" role="dialog" aria-modal="true" aria-label="所有应用" hidden><header class="overlay-header"><h2>所有应用</h2><button class="close" id="close-launcher" aria-label="关闭应用列表">×</button></header><input class="search" id="app-search" placeholder="搜索 Mac 上的应用" aria-label="搜索应用"><div class="app-grid" id="app-grid"></div><p id="empty-search" hidden>没有找到应用</p></section><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
let token = '', timer, polling = false, failures = 0, apps = [], appSignature = '', toastTimer, commanding = false, online = false;
try { token = localStorage.getItem('thunder-touch-bar-token') || ''; } catch {}
function saveToken(value) { token = value; try { value ? localStorage.setItem('thunder-touch-bar-token',value) : localStorage.removeItem('thunder-touch-bar-token'); } catch {} }
function text(id,value) { $(id).textContent = value == null ? '' : String(value); }
function notify(message) { text('toast',message); $('toast').hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('toast').hidden=true,4000); }
function connected(value,message) { online=value; $('screen').classList.toggle('offline',!value); text('connection',message); }
function unpair() { saveToken(''); clearTimeout(timer); connected(false,'需要重新配对'); $('pair').hidden=false; $('launcher-panel').hidden=true; text('pair-message','访问凭据已失效，请输入 Mac 上的新配对码。'); }
async function request(path,body) {
  const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),8000);
  try {
    const response=await fetch(path,{method:body?'POST':'GET',headers:{...(token?{Authorization:'Bearer '+token}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,signal:controller.signal,cache:'no-store'});
    if(response.status===401 && path!=='/api/pair') { unpair(); throw new Error('请重新配对'); }
    const data=await response.json();
    if(!response.ok || data.ok===false) throw new Error(data.message || '请求失败（'+response.status+'）');
    return data;
  } finally { clearTimeout(timeout); }
}
function image(element,src) { const valid=typeof src==='string' && /^data:image\/(png|jpeg|jpg|webp);base64,[A-Za-z0-9+/=]+$/.test(src); element.hidden=!valid; if(valid && element.getAttribute('src')!==src) element.src=src; if(!valid) element.removeAttribute('src'); return valid; }
function formatTime(n) { n=Math.max(0,Math.floor(n)); return Math.floor(n/60)+':'+String(n%60).padStart(2,'0'); }
function appButton(app,label) {
  const b=document.createElement('button'); b.className='app'+(app.running?' running':'')+(app.active?' selected':''); b.setAttribute('aria-label','打开 '+app.name); b.setAttribute('aria-pressed',String(!!app.active)); b.title=app.name+(app.running?' · 运行中':'');
  const icon=document.createElement('span'); icon.className='app-icon'; const img=document.createElement('img'); img.alt=''; if(image(img,app.icon))icon.append(img);else icon.textContent=String(app.name).slice(0,2); b.append(icon);
  if(label){const name=document.createElement('small');name.textContent=app.name;b.append(name);}
  b.onclick=()=>command('app.open',{id:app.id});return b;
}
function renderApps(){ $('dock-apps').replaceChildren(...apps.slice().sort((a,b)=>Number(b.running)-Number(a.running)).slice(0,12).map(a=>appButton(a,false))); renderSearch(); }
function renderSearch(){const filtered=apps.filter(a=>String(a.name).toLowerCase().includes($('app-search').value.toLowerCase()));$('app-grid').replaceChildren(...filtered.map(a=>appButton(a,true)));$('empty-search').hidden=filtered.length>0;}
function render(state){
  text('host',state.host || 'Mac'); const config=state.config || {};
  for(const key of ['music','agents','weather','apps','controls']) $(key+'-card').hidden=!config[key+'Enabled'];
  $('dashboard').hidden=!['music','agents','weather'].some(k=>config[k+'Enabled']); $('all-off').hidden=['music','agents','weather','apps','controls'].some(k=>config[k+'Enabled']);
  const m=state.music || {}; text('music-state',m.playing?'正在播放':'音乐');text('track-title',m.title || '未在播放');text('artist',[m.artist,m.album].filter(Boolean).join(' · '));text('music-message',m.message);
  $('cover-placeholder').hidden=image($('artwork'),m.artwork);$('toggle-play').setAttribute('aria-label',m.playing?'暂停':'播放');$('toggle-play').setAttribute('aria-pressed',String(!!m.playing));$('toggle-play').querySelector('use').setAttribute('href',m.playing?'#pause':'#play');
  document.querySelectorAll('[data-action^="music."]').forEach(b=>b.disabled=!m.available);
  if(m.permissionRequired){$('toggle-play').disabled=false;$('toggle-play').setAttribute('aria-label','授权并播放');$('toggle-play').title='授权并播放';text('music-message',(m.message || '')+' 点击播放，在 Mac 上授权。');}else $('toggle-play').removeAttribute('title');
  const seekable=m.available && Number.isFinite(m.duration) && m.duration>0 && Number.isFinite(m.position);$('seek').disabled=!seekable;if(document.activeElement!==$('seek')){$('seek').max=seekable?m.duration:1;$('seek').value=seekable?m.position:0;}text('elapsed',seekable?formatTime(m.position):'—');text('duration',seekable?formatTime(m.duration):'—');
  const a=state.agents || {};text('agents-message',a.message);$('agents').replaceChildren(...(a.items || []).map(item=>{const row=document.createElement('div');row.className='agent-row';const copy=document.createElement('div');copy.className='agent-copy';const name=document.createElement('strong');name.textContent=item.name;const detail=document.createElement('small');detail.textContent=[item.status,item.detail,item.updatedAt].filter(Boolean).join(' · ');copy.append(name,detail);row.append(copy);return row;}));
  const w=state.weather || {};text('city',w.city || '天气');text('temperature',w.available && Number.isFinite(w.temperature)?Math.round(w.temperature)+'°':'—');text('weather-description',w.available?w.description:w.message);text('weather-range',w.available?[Number.isFinite(w.high)?'最高 '+Math.round(w.high)+'°':'',Number.isFinite(w.low)?'最低 '+Math.round(w.low)+'°':''].filter(Boolean).join(' · '):'');text('weather-attribution',[w.attribution,w.updatedAt].filter(Boolean).join(' · '));
  const nextApps=Array.isArray(state.apps)?state.apps:[];const signature=JSON.stringify(nextApps);if(signature!==appSignature){apps=nextApps;appSignature=signature;renderApps();}
  const c=state.controls || {};for(const key of ['volume','brightness']){const available=c[key+'Available'] && Number.isFinite(c[key]);$(key).disabled=!available;if(document.activeElement!==$(key)&&available)$(key).value=c[key];text(key+'-value',available?Math.round(c[key]):'—');}
  $('mute-button').disabled=!(c.muteAvailable===undefined?c.volumeAvailable:c.muteAvailable);$('mute-button').setAttribute('aria-pressed',String(!!c.muted));$('mute-button').classList.toggle('active',!!c.muted);document.querySelectorAll('[data-action^="key."]').forEach(b=>b.disabled=!c.accessibility);text('controls-message',config.controlsEnabled?c.message:'');
}
async function poll(){
  clearTimeout(timer);if(polling || !token || document.hidden)return;polling=true;
  try{const state=await request('/api/state');if(token){render(state);failures=0;connected(true,'已连接 · 本地控制台');$('pair').hidden=true;}}
  catch(error){if(token){failures++;connected(false,'连接中断 · 正在重连');}}
  finally{polling=false;if(token&&!document.hidden)timer=setTimeout(poll,Math.min(1000*Math.pow(2,failures),15000));}
}
async function command(action,extra={}){if(!online||commanding){notify('连接中断或操作处理中，请稍后重试');return;}commanding=true;try{const data=await request('/api/command',{action,...extra});notify(data.message || '已执行');}catch(error){notify(error.name==='AbortError'?'操作超时，请检查 Mac；不会自动重试':error.message);}finally{commanding=false;poll();}}
$('pair-form').onsubmit=async e=>{e.preventDefault();$('pair-submit').disabled=true;text('pair-message','正在配对…');try{const data=await request('/api/pair',{code:$('pair-code').value.trim()});if(typeof data.token!=='string'||!data.token)throw new Error('配对响应无效');saveToken(data.token);$('pair-code').value='';text('pair-message','');await poll();}catch(error){text('pair-message',error.name==='AbortError'?'连接超时，请检查 Mac 是否已开启 Touch Bar':error.message);}finally{$('pair-submit').disabled=false;}};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>command(b.dataset.action));for(const [id,action] of [['seek','music.seek'],['volume','volume.set'],['brightness','brightness.set']]){$(id).onchange=()=>command(action,{value:Number($(id).value)});if(id!=='seek')$(id).oninput=()=>text(id+'-value',$(id).value);}
$('open-launcher').onclick=()=>{$('launcher-panel').hidden=false;$('app-search').focus();};function closeLauncher(){$('launcher-panel').hidden=true;$('open-launcher').focus();}$('close-launcher').onclick=closeLauncher;$('app-search').oninput=renderSearch;
document.addEventListener('keydown',e=>{if($('launcher-panel').hidden)return;if(e.key==='Escape')closeLauncher();if(e.key==='Tab'){const controls=[...$('launcher-panel').querySelectorAll('button,input')];const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.addEventListener('visibilitychange',()=>{clearTimeout(timer);if(!document.hidden)poll();});window.addEventListener('online',poll);$('pair').hidden=!!token;if(token)poll();
</script></body></html>
