<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Touch Bar</title><style>
:root{--card:#1c1c1e;--text:#f5f5f7;--muted:#98989e;--green:#30d158;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:#000;color:var(--text)}*{box-sizing:border-box}body{margin:0;background:#000}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:2px solid #0a84ff;outline-offset:3px}[hidden]{display:none!important}.screen{position:relative;display:grid;grid-template-rows:30px clamp(150px,42vh,220px) 96px 42px;align-content:space-between;gap:10px;width:100vw;height:100svh;min-height:320px;padding:17px max(22px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.machine,.state{display:flex;align-items:center;gap:8px}.machine strong{color:var(--text);font-weight:550}.machine svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}.state i,.agent i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 7px #30d15899}.cards{display:grid;grid-template-columns:minmax(315px,1.45fr) minmax(235px,1fr) minmax(160px,.58fr);gap:11px}.card{min-width:0;overflow:hidden;padding:16px;border:1px solid #29292b;border-radius:16px;background:var(--card)}.kicker{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.8px}.music{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;touch-action:pan-y}.cover{position:relative;width:clamp(94px,13vh,132px);aspect-ratio:1;overflow:hidden;border-radius:12px;background:#29292d;box-shadow:0 8px 20px #0008;transition:transform .22s}.cover.playing{transform:scale(1.045)}.cover img{width:100%;height:100%;object-fit:cover}.placeholder{display:grid;place-items:center;height:100%;font-size:46px}.cover button{position:absolute;inset:0;width:100%;display:grid;place-items:center;color:#fff;background:#0005;opacity:0}.cover:not(.playing) button{opacity:1}.play{width:0;height:0;margin-left:5px;border-top:15px solid transparent;border-bottom:15px solid transparent;border-left:23px solid white}.music-info{height:clamp(94px,13vh,132px);display:flex;min-width:0;flex-direction:column;justify-content:space-between}.music h1,.music p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.music h1{font-size:clamp(20px,2.7vh,27px);line-height:1.1}.music p{color:var(--muted);font-size:clamp(13px,1.65vh,16px)}.agents{display:flex;flex-direction:column}.agent-list{display:grid;gap:11px;margin:auto 0}.agent{display:grid;grid-template-columns:7px minmax(0,1fr) auto;align-items:center;gap:8px}.agent i{width:6px;height:6px}.agent strong,.agent span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.agent strong{font-size:12px}.agent span{margin-top:3px;color:var(--muted);font-size:10px}.agent time{color:#7f7f85;font-size:9px}.agent-foot{display:flex;justify-content:space-between;color:#77777c;font-size:10px}.weather{display:flex;flex-direction:column;justify-content:space-between}.weather-top{display:flex;justify-content:space-between}.weather svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.65;stroke-linecap:round}.temp{font-size:clamp(42px,6vh,66px);font-weight:250;line-height:.9}.weather p{margin:0;font-size:12px}.weather small,.city{color:var(--muted);font-size:10px}.dock{display:flex;align-items:center;gap:15px;min-width:0}.scroll{flex:1;overflow-x:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.apps{display:flex;align-items:flex-start;gap:16px;width:max-content;min-width:100%;padding:2px 5px 10px}.app{position:relative;width:72px;height:80px;padding:0;background:transparent}.app img{width:71px;height:71px;object-fit:contain;border-radius:18px}.app.running:after{content:"";position:absolute;bottom:0;left:34px;width:4px;height:4px;border-radius:50%;background:#d8d8dd}.launcher{width:70px;height:70px;flex:none;border-radius:17px;background:#29292b}.launcher svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:1.8}.strip{position:relative;height:42px;overflow:hidden;display:flex;align-items:center;background:#000}.strip img{width:100%;height:auto;display:block}.hit{position:absolute;top:0;bottom:0;padding:0;background:transparent}.reset{left:2%;width:3.5%}.brightness{left:6.4%;width:12.5%}.volume{left:72.5%;width:19%}.range{position:absolute;z-index:2;left:50%;top:50%;width:23%;height:30px;transform:translate(-50%,-50%);opacity:0}.sheet,.pair{position:fixed;z-index:5;inset:0;background:#000}.sheet{padding:20px 25px}.sheet-head{display:flex;justify-content:space-between}.sheet h2{margin:0;font-size:16px}.circle{width:34px;height:34px;border-radius:50%;background:#2c2c2e}.search{width:min(320px,100%);margin-top:14px;padding:10px 12px;border:1px solid #4a4a4d;border-radius:8px;color:var(--text);background:#242426}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:18px 13px;max-height:calc(100% - 67px);margin-top:18px;overflow:auto}.grid-app{display:grid;justify-items:center;gap:7px;min-width:0;padding:0;background:transparent}.grid-app img{width:64px;height:64px;object-fit:contain}.grid-app span{width:100%;overflow:hidden;color:#d1d1d6;font-size:10px;text-align:center;text-overflow:ellipsis;white-space:nowrap}.pair{display:grid;place-items:center;padding:20px}.pair form{width:min(420px,100%);padding:24px;border-radius:18px;background:var(--card)}.pair h1{margin:0 0 10px;font-size:24px}.pair p{color:#aaa;font-size:13px;line-height:1.6}.pair input,.pair button{width:100%;margin-top:10px;padding:12px;border:1px solid #444;border-radius:8px}.pair input{color:#fff;background:#252527;font-size:20px;letter-spacing:5px}.pair button{color:#111;background:#eee}.toast{position:fixed;z-index:9;bottom:16px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:15px;color:#181819;background:#f2f2f7;font-size:11px;white-space:nowrap}@media(max-height:410px){.screen{grid-template-rows:22px clamp(130px,39vh,165px) 74px 29px}.card{padding:11px}.cover,.music-info{width:82px;height:82px}.music-info{width:auto}.app{width:60px;height:67px}.app img{width:59px;height:59px}.app.running:after{left:28px}.launcher{width:60px;height:60px}.strip{height:29px}}@media(max-width:710px){.cards{grid-template-columns:minmax(260px,1.5fr) minmax(190px,1fr) 0}.weather{display:none}.machine>span,.state span{display:none}.strip img{min-width:720px}.brightness{left:21%}.volume{left:auto;right:4%}}@media(orientation:portrait){.screen{height:auto;min-height:100svh;grid-template-rows:30px 1fr 98px 30px}.cards{grid-template-columns:1fr}.weather{display:none}.strip img{min-width:760px}.brightness{left:20%}.volume{left:auto;right:3%}}
</style></head><body><main class="screen" id="screen"><header class="top"><div class="machine"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M2 19h20"/></svg><strong id="host">Mac</strong><span>· 本地控制台</span></div><div class="state"><i></i><span id="connection">正在连接</span></div></header><section class="cards" id="cards"><article class="card music" id="music-card"><div class="cover" id="cover"><span class="placeholder" id="placeholder">♫</span><img id="art" hidden><button id="play" aria-label="播放"><span class="play"></span></button></div><div class="music-info"><div class="kicker">NOW PLAYING</div><h1 id="title">未在播放</h1><p id="artist">等待播放器</p></div></article><article class="card agents" id="agents-card"><div class="kicker">AGENT BRIDGE · RUNNING</div><div class="agent-list" id="agents"></div><div class="agent-foot"><span id="agent-message"></span></div></article><article class="card weather" id="weather-card"><div class="weather-top"><span class="city" id="city">天气</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8"/><path d="M12 2v2.3m0 15.4V22M2 12h2.3m15.4 0H22M4.9 4.9l1.6 1.6m11 11 1.6 1.6M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg></div><strong class="temp" id="temp">—</strong><p id="weather">—</p><small id="range"></small></article></section><nav class="dock" id="dock"><div class="scroll"><div class="apps" id="apps"></div></div><button class="launcher" id="open-apps" aria-label="所有应用"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/></svg></button></nav><section class="strip" id="strip-box"><img id="strip" src="/assets/touchbar/control-strip.png" alt="Touch Bar"><input class="range" id="control-range" type="range" min="0" max="100" hidden><button class="hit reset" id="reset"></button><button class="hit brightness" id="bright"></button><button class="hit volume" id="volume"></button></section></main><section class="sheet" id="sheet" hidden><header class="sheet-head"><h2>所有应用</h2><div><button class="circle" id="search-toggle">⌕</button><button class="circle" id="close">×</button></div></header><input class="search" id="query" placeholder="搜索应用" hidden><div class="grid" id="grid"></div></section><section class="pair" id="pair"><form id="pair-form"><h1>Touch Bar</h1><p>在 Mac 的 Touch Bar 设置中查看配对码。</p><input id="code" inputmode="numeric" maxlength="6" placeholder="配对码" required><button>连接 Mac</button><p id="pair-message"></p></form></section><div class="toast" id="toast" hidden></div><script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('thunder-touch-bar-token')||'',apps=[],online=false,working=false,timer,toastTimer,startX=0;const text=(id,v)=>$(id).textContent=v??'';function flash(v){text('toast',v);$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,1800)}async function req(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{...(token?{Authorization:'Bearer '+token}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body&&JSON.stringify(body),cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.message||'请求失败');return d}async function command(action,value,id){if(!online||working)return;working=true;try{const d=await req('/api/command',{action,...(id?{id}:{}),...(value==null?{}:{value})});flash(d.message||'已执行')}catch(e){flash(e.message)}finally{working=false;poll()}}function app(a,grid){const b=document.createElement('button'),i=document.createElement('img');b.className=grid?'grid-app':`app${a.running?' running':''}`;i.src=a.icon;i.alt='';b.append(i);if(grid){const n=document.createElement('span');n.textContent=a.name;b.append(n)}b.onclick=()=>command("app.open",undefined,a.id);return b}function drawApps(q=''){const sorted=[...apps].sort((a,b)=>Number(b.active)-Number(a.active)||Number(b.running)-Number(a.running)||a.name.localeCompare(b.name));$('apps').replaceChildren(...sorted.map(a=>app(a)));$('grid').replaceChildren(...sorted.filter(a=>a.name.toLowerCase().includes(q.toLowerCase())).map(a=>app(a,true)))}function render(s){online=true;text('host',s.host);text('connection','已连接');const m=s.music||{};text('title',m.title||'未在播放');text('artist',[m.artist,m.album].filter(Boolean).join(' · ')||m.message||'等待播放器');$('play').disabled=!m.available;$('cover').classList.toggle('playing',!!m.playing);$('play').setAttribute('aria-label',m.playing?'暂停':'播放');if(m.artwork){$('art').src=m.artwork;$('art').hidden=false;$('placeholder').hidden=true}else{$('art').hidden=true;$('placeholder').hidden=false}const a=(s.agents||{}).items||[];$('agents-card').hidden=!a.length;text('agent-message',(s.agents||{}).message||'');$('agents').replaceChildren(...a.map(x=>{const r=document.createElement('div');r.className='agent';r.innerHTML='<i></i><div><strong></strong><span></span></div><time></time>';r.querySelector('strong').textContent=x.name;r.querySelector('span').textContent=x.detail||x.status;r.querySelector('time').textContent=x.status;return r}));const w=s.weather||{};text('city',w.city||'天气');text('temp',Number.isFinite(w.temperature)?Math.round(w.temperature)+'°':'—');text('weather',w.description||w.message||'—');text('range',[w.high!=null?'最高 '+Math.round(w.high)+'°':'',w.low!=null?'最低 '+Math.round(w.low)+'°':''].filter(Boolean).join(' · '));apps=s.apps||[];drawApps();const c=s.controls||{};$('bright').disabled=!c.brightnessAvailable;$('volume').disabled=!c.volumeAvailable;$('control-range').dataset.brightness=c.brightness??0;$('control-range').dataset.volume=c.volume??0}async function poll(){clearTimeout(timer);if(!token)return;try{render(await req('/api/state'));$('pair').hidden=true}catch(e){online=false;text('connection','连接中断');$('pair').hidden=false;text('pair-message',e.message)}finally{timer=setTimeout(poll,2500)}}$('pair-form').onsubmit=async e=>{e.preventDefault();try{const d=await req('/api/pair',{code:$('code').value});token=d.token;localStorage.setItem('thunder-touch-bar-token',token);poll()}catch(e){text('pair-message',e.message)}};$('play').onclick=()=>command('music.playPause');$('music-card').onpointerdown=e=>startX=e.clientX;$('music-card').onpointerup=e=>{if(Math.abs(e.clientX-startX)>45)command(e.clientX<startX?'music.next':'music.previous')};$('bright').onclick=()=>openControl('brightness');$('volume').onclick=()=>openControl('volume');$('reset').onclick=()=>closeControl();function openControl(kind){const range=$('control-range');range.hidden=false;range.value=range.dataset[kind];range.dataset.kind=kind;$('strip').src='/assets/touchbar/'+kind+'-strip.png'}function closeControl(){$('control-range').hidden=true;$('strip').src='/assets/touchbar/control-strip.png'}$('control-range').onchange=e=>command(e.target.dataset.kind+'.set',Number(e.target.value));$('open-apps').onclick=()=>$('sheet').hidden=false;$('close').onclick=()=>{$('sheet').hidden=true;$('query').hidden=true};$('search-toggle').onclick=()=>{$('query').hidden=!$('query').hidden;if(!$('query').hidden)$('query').focus()};$('query').oninput=e=>drawApps(e.target.value);if(token)poll();
</script></body></html>
